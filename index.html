let lang='ru', activeFilter='all';

function setSwitchFlag(){
  const s=document.getElementById('langSwitch');
  s.classList.remove('flag-ru','flag-uk');
  s.classList.add(lang==='uk'?'flag-uk':'flag-ru');
}
function positionPill(instant){
  const pill=document.getElementById('pill');
  const a=document.querySelector('.chip.active');
  if(!a)return;
  if(instant)pill.style.transition='none';
  pill.style.width=a.offsetWidth+'px';
  pill.style.transform='translateX('+a.offsetLeft+'px)';
  if(instant)requestAnimationFrame(()=>{pill.style.transition='';});
}
function applyLang(){
  const t=i18n[lang];
  document.documentElement.lang=lang;
  document.getElementById('search').placeholder=t.search;
  document.getElementById('curLang').textContent=t.code;
  document.getElementById('langSwitch').title=t.switch;
  const c=document.querySelectorAll('.chip');
  c[0].textContent=t.all;c[1].textContent=t.fine;c[2].textContent=t.severe;
  setSwitchFlag();render();
  requestAnimationFrame(()=>positionPill(true));
}
function pickLang(l){
  lang=l;applyLang();
  const g=document.getElementById('gate');
  g.classList.add('hide');
  setTimeout(()=>{
    g.style.display='none';
    g.classList.remove('anim'); /* .anim снят → ВСЕ анимации в #gate останавливаются по CSS-селекторам */
  },520);
}
function reopenGate(){
  const g=document.getElementById('gate');
  g.style.display='flex';
  g.classList.remove('hide');
  void g.offsetWidth;
  g.classList.add('anim');
}

let _searchTimer=null;
document.getElementById('search').addEventListener('input',()=>{
  clearTimeout(_searchTimer);
  _searchTimer=setTimeout(render,140);
});

function render(){
  const t=i18n[lang];
  const q=document.getElementById('search').value.trim().toLowerCase();
  const grid=document.getElementById('grid');
  let html='',shown=0,i=0;
  rules.forEach(rule=>{
    const title=rule.tt[lang]||rule.tt.uk;
    const typeOK=activeFilter==='all'||rule.items.some(x=>x.type===activeFilter);
    const inTitle=title.toLowerCase().includes(q);
    const inItems=q!==''&&rule.items.some(x=>(x.t[lang]+' '+x.p[lang]+' '+(x.sub||'')).toLowerCase().includes(q));
    if(!(typeOK&&(q===''||inTitle||inItems)))return;
    shown++;
    html+='<div class="rule-btn'+(i<12?' anim':'')+'" data-n="'+rule.num+'"'+(i<12?' style="animation-delay:'+(i*0.04)+'s"':'')+'><span class="num">'+rule.num+'</span><i class="ico fa-solid '+rule.icon+'"></i><span class="ttl">'+title+'</span></div>';i++;
  });
  grid.innerHTML=html;
  const e=document.getElementById('empty');
  e.textContent=t.empty;e.style.display=shown?'none':'block';
}
document.getElementById('grid').addEventListener('click',e=>{
  const b=e.target.closest('.rule-btn');if(!b)return;
  const rule=rules.find(r=>r.num==b.dataset.n);if(rule)openModal(rule);
});

let itemObserver=null;
let currentModalRule=null;
let modalTab=0;
function openModal(rule){
  currentModalRule=rule;
  modalTab=0;
  const modal=document.getElementById('modal');
  modal.classList.add('show');
  renderModalTab();
  requestAnimationFrame(()=>{ if(window.modalSliderUpdate)window.modalSliderUpdate(); });
}
function renderModalTab(){
  const rule=currentModalRule;if(!rule)return;
  const t=i18n[lang];
  const src=(modalTab===1&&rule.altTab)?rule.altTab:rule;
  document.getElementById('modalTitle').textContent=(modalTab===0?rule.num+'. ':'')+(src.tt[lang]||src.tt.uk);
  let h='';
  if(rule.altTab){
    h+='<div class="modal-tabs">'
      +'<button class="mtab'+(modalTab===0?' active':'')+'" data-tab="0"><i class="fa-solid '+rule.icon+'"></i>'+(rule.tt[lang]||rule.tt.uk)+'</button>'
      +'<button class="mtab'+(modalTab===1?' active':'')+'" data-tab="1"><i class="fa-solid '+rule.altTab.icon+'"></i>'+(rule.altTab.tt[lang]||rule.altTab.tt.uk)+'</button>'
      +'</div>';
  }
  if(src.image)h+='<img class="map-img" src="'+src.image+'" loading="lazy" decoding="async" alt="" onclick="openMapZoom(this.src)">';
  if(src.legend){
    h+='<div class="map-legend"><div class="legend-title"><i class="fa-solid fa-map"></i>'+(t.legendTitle||'')+'</div>';
    src.legend.forEach(l=>{
      const swStyle=(l.shape==='outline')
        ? 'background:'+(l.fill||'transparent')+';border-color:'+l.color+';'
        : 'background:'+l.color+';border-color:'+l.color+';';
      const swClass='legend-swatch'+(l.shape==='circle'?' circle':'')+(l.shape==='outline'?' outline':'');
      h+='<div class="legend-item"><span class="'+swClass+'" style="'+swStyle+'">'+(l.icon?'<i class="fa-solid '+l.icon+'"></i>':'')+'</span><span class="legend-text">'+(l.tt[lang]||l.tt.uk)+'</span></div>';
    });
    h+='</div>';
  }
  src.items.forEach(x=>{
    if(activeFilter!=='all'&&x.type!==activeFilter)return;
    h+='<div class="item">'+(x.sub?'<h4>'+x.sub+'</h4>':'')+'<p>'+x.t[lang]+'</p><span class="penalty '+x.type+'">'+t.penalty+': '+x.p[lang]+'</span></div>';
  });
  const body=document.getElementById('modalBody');
  body.innerHTML=h;
  body.querySelectorAll('.mtab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const tab=+btn.dataset.tab;
      if(tab===modalTab)return;
      modalTab=tab;
      renderModalTab();
      const scroller=document.querySelector('#modal .modal-scroll');
      scroller.scrollTop=0;
    });
  });
  const scroller=document.querySelector('#modal .modal-scroll');
  scroller.scrollTop=0;

  if(itemObserver)itemObserver.disconnect();
  const items=[...body.querySelectorAll('.item')];

  if(matchMedia('(prefers-reduced-motion:reduce)').matches || !('IntersectionObserver' in window)){
    items.forEach(it=>it.classList.add('in'));
    return;
  }

  itemObserver=new IntersectionObserver((entries,obs)=>{
    const vis=entries.filter(e=>e.isIntersecting)
                     .sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    vis.forEach((en,k)=>{
      en.target.style.animationDelay=(k*0.07).toFixed(2)+'s';
      en.target.classList.add('in');
      obs.unobserve(en.target);
    });
  },{root:scroller, threshold:0.06});

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    items.forEach(it=>itemObserver.observe(it));
  }));
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  if(itemObserver){itemObserver.disconnect();itemObserver=null;}
  currentModalRule=null;
}

/* Кастомный скроллбар модалки */
(function(){
  const slider=document.getElementById('mSlider');
  const thumb=document.getElementById('mThumb');
  const scroller=document.querySelector('#modal .modal-scroll');
  if(!slider||!thumb||!scroller)return;

  let _rafPending=false;
  function update(){
    if(_rafPending)return;
    _rafPending=true;
    requestAnimationFrame(()=>{
      _rafPending=false;
      const sh=scroller.scrollHeight, ch=scroller.clientHeight, st=scroller.scrollTop;
      const overflow=sh-ch;
      if(overflow<=4){slider.classList.remove('on');return;}
      slider.classList.add('on');
      const trackH=slider.clientHeight;
      const th=Math.max(40, trackH*ch/sh);
      const maxTop=trackH-th;
      const top=(st/overflow)*maxTop;
      thumb.style.height=th+'px';
      thumb.style.transform='translateY('+top+'px)';
    });
  }
  window.modalSliderUpdate=update;
  scroller.addEventListener('scroll',update,{passive:true});
  addEventListener('resize',update);

  let dragging=false,startY=0,startScroll=0;
  thumb.addEventListener('pointerdown',e=>{
    dragging=true;thumb.classList.add('drag');
    try{thumb.setPointerCapture(e.pointerId);}catch(_){}
    startY=e.clientY;startScroll=scroller.scrollTop;e.preventDefault();
  });
  thumb.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const trackH=slider.clientHeight, th=thumb.offsetHeight;
    const overflow=scroller.scrollHeight-scroller.clientHeight;
    const maxTop=trackH-th;
    const ratio=maxTop? (e.clientY-startY)/maxTop : 0;
    scroller.scrollTop=startScroll+ratio*overflow;
  });
  function stop(){dragging=false;thumb.classList.remove('drag');}
  thumb.addEventListener('pointerup',stop);
  thumb.addEventListener('pointercancel',stop);
  slider.addEventListener('pointerdown',e=>{
    if(e.target===thumb)return;
    const rect=slider.getBoundingClientRect(), th=thumb.offsetHeight;
    const trackH=slider.clientHeight, maxTop=trackH-th;
    const overflow=scroller.scrollHeight-scroller.clientHeight;
    const ratio=Math.min(1,Math.max(0,(e.clientY-rect.top-th/2)/maxTop));
    scroller.scrollTo({top:ratio*overflow,behavior:'smooth'});
  });
})();

/* ===== MAP IMAGE ZOOM VIEWER =====
   Изображение показывается в НАТИВНОМ пиксельном разрешении (без max-width/
   max-height), а вписывание в экран и весь зум/пан считаются в JS через
   translate+scale. Раньше картинка сначала растрировалась уменьшенной
   (max-width:92vw), а потом transform:scale просто увеличивал уже смазанный
   растр — отсюда была нечёткость. Теперь при зуме видно реальные пиксели
   картинки, чётко, пока не упрёшься в её собственное разрешение (как в фотошопе).
   Колесо мыши / щипок двумя пальцами — зум к точке курсора/пальцев,
   зажать и тянуть — перемещение, двойной клик/тап — сброс или приближение. */
(function(){
  const overlay=document.getElementById('imgZoom');
  const img=document.getElementById('zoomImg');
  const hint=document.getElementById('zoomHint');
  const PAD=0.94; // доля вьюпорта, в которую вписываем картинку при открытии
  let fitScale=1,scale=1,posX=0,posY=0;
  let dragging=false,startX=0,startY=0,startPosX=0,startPosY=0;
  let pinchDist=0,pinchScale=1;

  function apply(){ img.style.transform='translate('+posX+'px,'+posY+'px) scale('+scale+')'; }
  function clampScale(s){ return Math.min(fitScale*10,Math.max(fitScale,s)); }
  function centerAt(fs){
    const w=img.naturalWidth*fs, h=img.naturalHeight*fs;
    posX=(window.innerWidth-w)/2;
    posY=(window.innerHeight-h)/2;
  }
  function reset(){ scale=fitScale; centerAt(scale); apply(); }
  function zoomAt(screenX,screenY,newScale){
    newScale=clampScale(newScale);
    const ratio=newScale/scale;
    posX=screenX-(screenX-posX)*ratio;
    posY=screenY-(screenY-posY)*ratio;
    scale=newScale;
    apply();
  }

  window.openMapZoom=function(src){
    img.classList.remove('ready');
    img.src=src;
    const onReady=()=>{
      const nw=img.naturalWidth||1, nh=img.naturalHeight||1;
      fitScale=Math.min(1,(window.innerWidth*PAD)/nw,(window.innerHeight*PAD)/nh);
      scale=fitScale;
      centerAt(scale);
      apply();
      img.classList.add('ready');
    };
    if(img.complete && img.naturalWidth) onReady();
    else img.onload=onReady;
    overlay.classList.add('show');
    hint.textContent=(i18n[lang]&&i18n[lang].zoomHint)||'';
    document.body.style.overflow='hidden';
  };
  function closeZoom(){
    overlay.classList.remove('show');
    document.body.style.overflow='';
    setTimeout(()=>{ if(!overlay.classList.contains('show')){img.src='';img.classList.remove('ready');} },250);
  }
  document.getElementById('zoomClose').addEventListener('click',closeZoom);
  overlay.addEventListener('click',e=>{ if(e.target===overlay||e.target===document.getElementById('zoomStage'))closeZoom(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&overlay.classList.contains('show'))closeZoom(); });
  window.addEventListener('resize',()=>{ if(overlay.classList.contains('show')&&img.naturalWidth){
    const nw=img.naturalWidth,nh=img.naturalHeight;
    fitScale=Math.min(1,(window.innerWidth*PAD)/nw,(window.innerHeight*PAD)/nh);
    if(scale<fitScale)scale=fitScale;
    centerAt(scale);apply();
  }});

  overlay.addEventListener('wheel',e=>{
    if(!overlay.classList.contains('show'))return;
    e.preventDefault();
    zoomAt(e.clientX,e.clientY,scale*(e.deltaY<0?1.2:1/1.2));
  },{passive:false});

  img.addEventListener('mousedown',e=>{
    e.preventDefault();dragging=true;img.classList.add('dragging');
    startX=e.clientX;startY=e.clientY;startPosX=posX;startPosY=posY;
  });
  window.addEventListener('mousemove',e=>{
    if(!dragging)return;
    posX=startPosX+(e.clientX-startX);posY=startPosY+(e.clientY-startY);
    apply();
  });
  window.addEventListener('mouseup',()=>{dragging=false;img.classList.remove('dragging');});

  img.addEventListener('dblclick',e=>{
    if(scale>fitScale*1.01)reset();
    else zoomAt(e.clientX,e.clientY,fitScale*3.2);
  });

  function touchDist(t){ const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
  overlay.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      pinchDist=touchDist(e.touches);pinchScale=scale;
    } else if(e.touches.length===1){
      dragging=true;
      startX=e.touches[0].clientX;startY=e.touches[0].clientY;startPosX=posX;startPosY=posY;
    }
  },{passive:true});
  overlay.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      e.preventDefault();
      const midX=(e.touches[0].clientX+e.touches[1].clientX)/2;
      const midY=(e.touches[0].clientY+e.touches[1].clientY)/2;
      zoomAt(midX,midY,pinchScale*(touchDist(e.touches)/pinchDist));
    } else if(e.touches.length===1&&dragging){
      e.preventDefault();
      posX=startPosX+(e.touches[0].clientX-startX);posY=startPosY+(e.touches[0].clientY-startY);
      apply();
    }
  },{passive:false});
  overlay.addEventListener('touchend',()=>{dragging=false;});
})();
